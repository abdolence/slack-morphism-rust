name: tests & formatting
on: 
  push:
  pull_request:
    types: [opened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --features hyper,axum -- -Dwarnings && cargo test --features hyper,axum
      - run: cargo clippy --all-features -- -Dwarnings && cargo test --all-features
      - run: cargo check --no-default-features --features hyper
      - run: cargo check --no-default-features --features axum
  blockkit-to-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --manifest-path tools/blockkit-to-rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/blockkit-to-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/blockkit-to-rust/Cargo.toml
      - run: cargo check --manifest-path tools/blockkit-to-rust/Cargo.toml --lib --target wasm32-unknown-unknown
