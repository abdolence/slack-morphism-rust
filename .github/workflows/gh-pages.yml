name: build book/docs

on:
  push:
    branches:
      - master
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
      - name: Build converter
        run: wasm-pack build tools/blockkit-to-rust --release --target web --no-typescript --no-pack --out-dir ../../docs/src/blockkit --out-name blockkit_to_rust
      - run: cd docs && mdbook build
      # wasm-pack writes a `.gitignore` containing `*` into its out-dir and mdbook
      # copies it into the output; the publish action adds files with git, so
      # that file would silently drop the module from the site.
      - name: Unignore the converter module
        run: rm -f docs/output/blockkit/.gitignore
      - name: Copy CNAME
        run: cp CNAME docs/output
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/output
          publish_branch: gh-pages
