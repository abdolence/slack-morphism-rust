name: windows build test
on:
  push:
  pull_request:
    types: [ opened ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  AWS_LC_SYS_NO_ASM: true
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --features hyper,axum -- -Dwarnings && cargo test --features hyper,axum
      - run: cargo clippy --all-features -- -Dwarnings && cargo test --all-features
