[package]
name = "blockkit-to-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Converts Slack Block Kit JSON into slack-morphism builder code"

[workspace]

[dependencies]
slack-morphism = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
